name: KisanLink Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build KisanLink APK
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: https://kisanlink-api-ksfw.onrender.com
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: ''

      - name: Install Android command line tools
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
          rmdir "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Install TypeScript required by Capacitor
        run: npm install --no-save --save-dev typescript@^5.9.2

      - name: Verify Capacitor toolchain
        run: |
          node --version
          npm --version
          npx tsc --version
          npx cap --version

      - name: Build web app for Render backend
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KisanLink-Render-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KisanLink-Android-APK
          path: KisanLink-Render-debug.apk
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kisanlink-build-${{ github.run_number }}
          name: KisanLink Android Build ${{ github.run_number }}
          body: |
            KisanLink Android debug APK built from `${{ github.sha }}`.
            The web app is configured to use the Render backend:
            https://kisanlink-api-ksfw.onrender.com
          files: KisanLink-Render-debug.apk
          draft: false
          prerelease: false
