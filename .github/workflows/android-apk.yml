name: KisanLink Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build KisanLink APK
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: https://kisanlink-api-ksfw.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install web dependencies
        run: npm ci

      - name: Build web app for Render backend
        run: npm run build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KisanLink-Render-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KisanLink-Android-APK
          path: KisanLink-Render-debug.apk
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kisanlink-build-${{ github.run_number }}
          name: KisanLink Android Build ${{ github.run_number }}
          body: |
            KisanLink Android debug APK built from `${{ github.sha }}`.
            The web app is configured to use the Render backend:
            https://kisanlink-api-ksfw.onrender.com
          files: KisanLink-Render-debug.apk
          draft: false
          prerelease: false
